import java.nio.file.Files
import java.nio.file.LinkOption

apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
apply from: '../shared/common.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    compileSdk **APIVERSION**
    buildToolsVersion = "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**

// Unity 6 + Gradle 8.13:
// - libc++_shared.so can be a symlink (Gradle cannot snapshot it)
// - StripDebugSymbols is incremental and CANNOT use doNotTrackState
//   (that causes "Changes are not tracked, unable determine incremental changes")
// Fix: untrack only CMake, materialize symlinks, and skip strip tasks.
ext.materializeNativeSymlinks = { File root ->
    if (root == null || !root.exists()) {
        return
    }
    root.eachFileRecurse { File f ->
        if (!f.isFile()) {
            return
        }
        def path = f.toPath()
        if (Files.isSymbolicLink(path) || !Files.isRegularFile(path, LinkOption.NOFOLLOW_LINKS)) {
            try {
                def real = path.toRealPath()
                def bytes = Files.readAllBytes(real)
                Files.deleteIfExists(path)
                Files.write(path, bytes)
            } catch (Throwable ignored) {
            }
        }
    }
}

tasks.configureEach { task ->
    def n = task.name

    if (n.startsWith("buildCMake")) {
        task.doNotTrackState("Unity CMake symlink workaround")
        task.doLast {
            materializeNativeSymlinks(file("$buildDir/intermediates/cxx"))
            materializeNativeSymlinks(file("$projectDir/src/main/jniLibs"))
        }
    }

    if (n.startsWith("merge") && n.contains("NativeLibs")) {
        task.doLast {
            materializeNativeSymlinks(file("$buildDir/intermediates/merged_native_libs"))
            materializeNativeSymlinks(file("$buildDir/intermediates/cxx"))
        }
    }

    // Skip AGP strip — doNotTrackState is incompatible with this incremental task.
    if (n.contains("strip") && n.contains("DebugSymbols")) {
        task.enabled = false
    }
}
